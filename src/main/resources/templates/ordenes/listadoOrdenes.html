<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${titulo})}"></head>
<body>

    <header th:replace="~{layout/base :: navbar}"></header>

    <main class="contenedor">
        <h1 class="titulo" th:text="${titulo}">Listado de Ordenes</h1>

        <div class="acciones-superiores">
            <a class="btn btn-primary" th:href="@{/app/ordenes/nuevo}">
                + Nueva órden
            </a>
        </div>

        <table class="tabla" cellpadding="8">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha creación</th>
                    <th>Estado</th>
                    <th>Cliente</th>
                    <th>Total compra</th>
                    <th>Productos</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="orden : ${ordenes}">
                    <td th:text="${orden.id}">1</td>
                    <td th:text="${orden.fechaCreacion}">2026-05-14</td>
                    <td th:text="${orden.estado}">EMITIDA</td>

                    <td th:text="${orden.cliente != null ? orden.cliente.nombre : 'Sin cliente'}">
                        Cliente ejemplo
                    </td>

                    <td th:text="${orden.totalCompra}">10000</td>

                    <td>
                        <ul>
                            <li th:each="producto : ${orden.productos}"
                                th:text="${producto.nombreProducto}">
                                Producto ejemplo
                            </li>
                        </ul>
                    </td>

                    <td>
                        <a class="btn btn-warning" th:href="@{/app/ordenes/editar/{id}(id=${orden.id})}">
                            Editar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
