<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${titulo})}"></head>
<body>

    <header th:replace="~{layout/base :: navbar}"></header>

    <main class="contenedor">
        <h1 class="titulo" th:text="${titulo}">Listado de Clientes</h1>

        <div class="acciones-superiores">
            <a class="btn btn-primary" th:href="@{/app/clientes/nuevo}">
                + Nuevo cliente
            </a>
        </div>
    
        <table class="tabla" cellpadding="8">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Acciones</th>
                </tr>
            </thead>
    
            <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.id}">1</td>
                    <td th:text="${cliente.nombre}">Nombre ejemplo</td>
                    <td th:text="${cliente.apellido}">Apellido ejemplo</td>
                    <td>
                        <a class="btn btn-warning" th:href="@{/app/clientes/editar/{id}(id=${cliente.id})}">
                            Editar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
