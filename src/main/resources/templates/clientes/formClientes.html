<head th:replace="~{layout/base :: head(${titulo})}"></head>
<main class="contenedor">
    <h1 class="titulo" th:text="${titulo}">Formulario cliente</h1>

    <form class="form-card"
        th:action="@{/app/clientes/guardar}"
        th:object="${cliente}"
        method="post">
    
        <input type="hidden" th:field="*{id}">
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}">
        </div>
    
        <div class="form-group">
            <label>Apellido</label>
            <input type="text" th:field="*{apellido}">
        </div>
    
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                Guardar
            </button>

            <a th:href="@{/app/clientes}" class="btn btn-secondary">
                Cancelar
            </a>
        </div>
    </form>
</main>
